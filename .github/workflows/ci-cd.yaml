name: CI/CD Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Deploy environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =========================================================================
  # Lint & Type Check
  # =========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy bandit

      - name: Verify requirement pins exist on PyPI
        # A pin for a version that was never published only fails much later,
        # inside a Docker build, as "No matching distribution found". Checking
        # here turns a red image build into a fast, obvious lint failure.
        run: python scripts/check_pins.py --strict

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: MyPy (strict)
        run: |
          pip install -r requirements/base.txt
          mypy --strict ingestion feature_extraction detection alerting output

      - name: Bandit (security lint)
        run: bandit -r ingestion feature_extraction detection alerting output -x tests --skip B101,B104,B110,B601,B603,B607

  # =========================================================================
  # Unit Tests
  # =========================================================================
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Unit tests need only the test profile (~30 MB). Installing ml.txt
          # here (torch, xgboost, mlflow, ...) exhausted the runner disk.
          # Do not "help" by pre-clearing /usr/share/dotnet etc. - that rm -rf
          # measured 7m11s on the runner filesystem and dwarfed the test run.
          pip install -r requirements/test.txt

      - name: Run unit tests
        run: |
          pytest tests/unit -v --cov=ingestion --cov=feature_extraction --cov=detection --cov=alerting --cov=output --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml

  # =========================================================================
  # Integration Tests (requires services)
  # =========================================================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Skipped until tests/integration/ contains actual tests. Enabling the
    # Redpanda service container for an empty test dir just burns runner minutes
    # and adds a flaky dependency. Flip to true on the day integration tests land.
    # Re-enable on the day integration tests land. Until then this only spins up
    # a Redpanda container for an empty test directory.
    if: false
    services:
      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
        ports: ["9092:9092", "8081:8081"]
        options: >-
          --health-cmd "rpk cluster health --timeout 10s"
          --health-interval 15s
          --health-start-period 30s
          --health-timeout 10s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/ingest.txt
          pip install pytest pytest-asyncio

      - name: Run integration tests
        run: pytest tests/integration -v

  # =========================================================================
  # Build Shared Base Image
  # =========================================================================
  # Every service Dockerfile declares:
  #   ARG BASE_IMAGE=anomaly-detection/base:latest
  #   FROM ${BASE_IMAGE} AS builder
  # The default is a local tag that does not exist on a clean runner, so the
  # base is built and pushed here first, then referenced by its GHCR tag.
  build-base:
    name: Build Base Image
    needs: [lint, test-unit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/base
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push base
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # Build Docker Images
  # =========================================================================
  build:
    name: Build & Push Images
    needs: [lint, test-unit, build-base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # Only services with a committed Dockerfile are listed here.
        # Grows as each ingestor/detector is implemented (see Day plan).
        service:
          - ingestion/pcap
          - ingestion/live_capture
          - ingestion/netflow
          - ingestion/zeek
          - ingestion/cloud_flows
          - detection/fast_path
        # --- Uncomment as these are built (Day 4-8) ---
        # - feature_extraction
        # - detection/deep_path
        # - detection/model_registry
        # - alerting
        # - output/siem
        # - output/dashboard
        # - output/integrations
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          # Override the local-tag default so the runner uses the base image
          # published by the build-base job instead of trying to pull a
          # nonexistent docker.io/anomaly-detection/base.
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/base:latest
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # Deploy to Dev (k3d)
  # =========================================================================
  deploy-dev:
    name: Deploy to Dev
    needs: [build, test-unit]
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    # NOTE: Requires secrets.KUBECONFIG_DEV. Disabled until Day 9 when the
    # k3d dev overlay is verified end-to-end.
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d cluster create anomaly-detection --agents 2 -p "8080:80@loadbalancer" -p "8443:443@loadbalancer" --wait

      - name: Set up kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_DEV }}

      - name: Deploy with Kustomize
        run: |
          kubectl apply -k k8s/overlays/dev
          kubectl wait --for=condition=available --timeout=300s deployment -n anomaly-detection --all

      - name: Smoke test
        run: |
          kubectl run smoke-test --rm -it --restart=Never --image=curlimages/curl -- \
            curl -sf http://redpanda.streaming.svc.cluster.local:8081/subjects

  # =========================================================================
  # Deploy to Prod (GitOps via ArgoCD)
  # =========================================================================
  deploy-prod:
    name: Deploy to Prod
    needs: [build, test-unit]
    if: github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.deploy_env == 'prod'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Update Kustomize image tags
        run: |
          # This would update the prod overlay with new image tags
          # ArgoCD then syncs automatically
          echo "Image tags updated for prod deployment"

      - name: Notify ArgoCD
        run: |
          # Trigger ArgoCD sync via webhook or CLI
          echo "ArgoCD sync triggered"