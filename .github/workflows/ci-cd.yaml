name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Deploy environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =========================================================================
  # Lint & Type Check
  # =========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install ruff black mypy bandit

      - name: Run Ruff
        run: ruff check .

      - name: Run Black
        run: black --check .

      - name: Run MyPy
        run: mypy --strict ingestion detection feature_extraction alerting output

      - name: Run Bandit
        run: bandit -r ingestion detection feature_extraction alerting output

  # =========================================================================
  # Unit Tests
  # =========================================================================
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/ml.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run unit tests
        run: |
          pytest tests/unit -v --cov=ingestion --cov=feature_extraction --cov=detection --cov=alerting --cov=output --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml

  # =========================================================================
  # Integration Tests (requires services)
  # =========================================================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
        ports: ["9092:9092", "8081:8081"]
        options: >-
          --health-cmd "rpk cluster health --timeout 3s"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/ingest.txt
          pip install pytest pytest-asyncio

      - name: Run integration tests
        run: pytest tests/integration -v

  # =========================================================================
  # Build Docker Images
  # =========================================================================
  build:
    name: Build & Push Images
    needs: [lint, test-unit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - ingestion/pcap
          - ingestion/live_capture
          - ingestion/netflow
          - ingestion/zeek
          - ingestion/cloud_flows
          - feature_extraction
          - detection/fast_path
          - detection/deep_path
          - detection/model_registry
          - alerting
          - output/siem
          - output/dashboard
          - output/integrations
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # Deploy to Dev (k3d)
  # =========================================================================
  deploy-dev:
    name: Deploy to Dev
    needs: [build, test-integration]
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d cluster create anomaly-detection --agents 2 -p "8080:80@loadbalancer" -p "8443:443@loadbalancer" --wait

      - name: Set up kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_DEV }}

      - name: Deploy with Kustomize
        run: |
          kubectl apply -k k8s/overlays/dev
          kubectl wait --for=condition=available --timeout=300s deployment -n anomaly-detection --all

      - name: Smoke test
        run: |
          kubectl run smoke-test --rm -it --restart=Never --image=curlimages/curl -- \
            curl -sf http://redpanda.streaming.svc.cluster.local:8081/subjects

  # =========================================================================
  # Deploy to Prod (GitOps via ArgoCD)
  # =========================================================================
  deploy-prod:
    name: Deploy to Prod
    needs: [build, test-integration]
    if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Update Kustomize image tags
        run: |
          # This would update the prod overlay with new image tags
          # ArgoCD then syncs automatically
          echo "Image tags updated for prod deployment"

      - name: Notify ArgoCD
        run: |
          # Trigger ArgoCD sync via webhook or CLI
          echo "ArgoCD sync triggered"