# ArgoCD Application for the Anomaly Detection Platform
# This Application manages all components of the anomaly detection platform
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: anomaly-detection-platform
  namespace: argocd
  labels:
    app.kubernetes.io/name: anomaly-detection-platform
    app.kubernetes.io/part-of: anomaly-detection
spec:
  project: default
  source:
    repoURL: https://github.com/kavymakhesana07-droid/ai-network-anomaly-detection.git
    targetRevision: HEAD
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: anomaly-detection
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.spec.containers[].env[] | select(.name | contains("PASSWORD") or contains("TOKEN") or contains("SECRET"))

