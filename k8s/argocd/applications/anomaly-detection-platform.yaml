---
# ArgoCD Project for the Anomaly Detection Platform
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: anomaly-detection
  namespace: argocd
spec:
  description: Anomaly Detection Platform Project
  sourceRepos:
    - https://github.com/kavymakhesana07-droid/ai-network-anomaly-detection.git
  destinations:
    - namespace: anomaly-detection
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: streaming
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: ""
      kind: PersistentVolume
    - group: ""
      kind: PersistentVolumeClaim
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
  roles:
    - name: admin
      description: Admin role for anomaly detection platform
      policies:
        - p, proj:anomaly-detection:admin, applications, *, anomaly-detection/*, allow
    - name: developer
      description: Developer role for anomaly detection platform
      policies:
        - p, proj:anomaly-detection:developer, applications, get, anomaly-detection/*, allow
        - p, proj:anomaly-detection:developer, applications, sync, anomaly-detection/*, allow
    - name: viewer
      description: Viewer role for anomaly detection platform
      policies:
        - p, proj:anomaly-detection:viewer, applications, get, anomaly-detection/*, allow