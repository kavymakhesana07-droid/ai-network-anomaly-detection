# Service Deployments
# This file contains all service deployments for the anomaly detection platform

---
# Ingestion Services
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcap-ingestor
  namespace: anomaly-detection
  labels:
    app: pcap-ingestor
    component: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pcap-ingestor
  template:
    metadata:
      labels:
        app: pcap-ingestor
        component: ingestion
    spec:
      containers:
        - name: pcap-ingestor
          image: ghcr.io/kavymakhesana07-droid/anomaly-detection/ingestion/pcap:latest
          imagePullPolicy: Always
          env:
            - name: KAFKA_BROKERS
              value: "redpanda.streaming.svc.cluster.local:9092"
            - name: TOPIC
              value: "raw.packets"
            - name: PCAP_PATH
              value: "/data/sample.pcap"
            - name: BATCH_SIZE
              value: "1000"
            - name: FLUSH_INTERVAL_MS
              value: "100"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kafka-data-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-capture-ingestor
  namespace: anomaly-detection
  labels:
    app: live-capture-ingestor
    component: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: live-capture-ingestor
  template:
    metadata:
      labels:
        app: live-capture-ingestor
        component: ingestion
    spec:
      containers:
        - name: live-capture-ingestor
          image: ghcr.io/kavymakhesana07-droid/anomaly-detection/ingestion/live_capture:latest
          imagePullPolicy: Always
          securityContext:
            capabilities:
              add:
                - NET_RAW
                - NET_ADMIN
          env:
            - name: KAFKA_BROKERS
              value: "redpanda.streaming.svc.cluster.local:9092"
            - name: TOPIC
              value: "raw.packets"
            - name: INTERFACE
              value: "eth0"
            - name: PROMISC
              value: "true"
            - name: SNAPLEN
              value: "65535"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

