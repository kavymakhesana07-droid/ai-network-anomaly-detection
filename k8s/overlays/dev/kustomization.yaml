apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: anomaly-detection

resources:
  - ../../base/namespace.yaml
  - ../../base/storage.yaml
  - ../../base/redpanda.yaml

commonLabels:
  environment: dev
  managed-by: kustomize

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: redpanda
        namespace: streaming
      spec:
        template:
          spec:
            containers:
              - name: redpanda
                resources:
                  requests:
                    cpu: "250m"
                    memory: "512Mi"
                  limits:
                    cpu: "1000m"
                    memory: "1Gi"