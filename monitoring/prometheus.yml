global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'anomaly-detection'
    environment: 'dev'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Redpanda metrics
  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644']
    metrics_path: /metrics

  # Feature Extractor
  - job_name: 'feature-extractor'
    static_configs:
      - targets: ['feature-extractor:9090']

  # Fast Path Detection
  - job_name: 'fast-path'
    static_configs:
      - targets: ['fast-path:9090']

  # Deep Path Detection
  - job_name: 'deep-path'
    static_configs:
      - targets: ['deep-path:9090']

  # Alerting
  - job_name: 'alerting'
    static_configs:
      - targets: ['alerting:9090']

  # Dashboard
  - job_name: 'dashboard'
    static_configs:
      - targets: ['dashboard:8501']

  # SIEM Output
  - job_name: 'siem-output'
    static_configs:
      - targets: ['siem-output:9090']

  # MLflow
  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']

  # Node Exporter (if running)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  # cAdvisor (container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']