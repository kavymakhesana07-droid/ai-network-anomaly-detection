[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-detection"
version = "0.1.0"
description = "Production-grade AI Network Anomaly Detection System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Kavy Makhesana", email = "kanomakhesana@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    # Core
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    # Kafka
    "aiokafka>=0.10.0",
    "confluent-kafka>=2.5.0",
    # Serialization
    "msgpack>=1.0.8",
    "orjson>=3.10.0",
    # Observability
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
base = []
ingest = [
    "scapy>=2.5.6",
    "pyshark>=0.6",
    "dpkt>=1.9.8",
    "boto3>=1.35.0",
]
ml = [
    "numpy>=1.26.4",
    "scipy>=1.13.1",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.2",
    "polars>=1.9.0",
    "torch>=2.4.0",
    "xgboost>=2.1.1",
    "lightgbm>=4.4.0",
    "onnx>=1.16.1",
    "onnxruntime>=1.19.2",
    "mlflow>=2.15.1",
    "dvclive>=2.11.0",
]
features = [
    "networkx>=3.3",
    "tsfresh>=0.20.1",
    "river>=0.21.0",
]
detect_fast = [
    "joblib>=1.4.2",
    "redis>=5.0.8",
]
detect_deep = [
    "pyspark>=3.5.0",
    "transformers>=4.42.0",
    "accelerate>=0.31.0",
    "optuna>=4.0.0",
    "ray>=2.40.0",
]
alerting = [
    "ipwhois>=1.2.0",
    "python-whois>=0.9.0",
    "dnspython>=2.6.1",
    "requests>=2.32.3",
    "stix2>=3.0.1",
]
output = [
    "elasticsearch>=8.14.0",
    "opensearch-py>=2.5.0",
    "slack-sdk>=3.26.0",
    "pagerduty>=5.0.2",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "streamlit>=1.37.0",
]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.13.0",
    "ruff>=0.5.7",
    "black>=24.8.0",
    "mypy>=1.11.2",
    "bandit>=1.7.8",
    "pre-commit>=3.7.0",
]
all = [
    "ingest",
    "ml",
    "features",
    "detect_fast",
    "detect_deep",
    "alerting",
    "output",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*", "feature_extraction*", "detection*", "alerting*", "output*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "ARG", "PTH", "ERA", "PL", "TRY"
]
ignore = ["S101", "S603", "S607"]
per-file-ignores = {
    "tests/*": ["S101", "S603", "S607"],
    "scripts/*": ["S101", "S603", "S607"],
}
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
implicit_optional = false
allow_redefinition = false
namespace_packages = true

[tool.mypy.overrides]
module = [
    "aiokafka*",
    "confluent_kafka*",
    "pyshark*",
    "scapy*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "gpu: Requires GPU",
]

[tool.bandit]
exclude_dirs = ["tests", "scripts", ".venv", "venv"]
skips = ["B101", "B601", "B603", "B607"]

[tool.coverage.run]
source = ["ingestion", "feature_extraction", "detection", "alerting", "output"]
omit = ["tests/*", "scripts/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]